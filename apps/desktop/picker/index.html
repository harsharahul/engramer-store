<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engram Store</title>
<style>
  /* Dark-first, like the app this page hands off to. */
  :root {
    --bg: #0a0e17; --card: #10182a; --edge: #1d2942; --fg: #eef2f8;
    --muted: #8b97ab; --accent: #3b82f6; --accent-press: #5b96f2;
    --store: #8aa9f5; --cyan: #22d3ee; --error: #ff8f88;
    --field: #0d1424;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fb; --card: #ffffff; --edge: #dfe5ee; --fg: #17202e;
      --muted: #5b6675; --accent: #3b82f6; --accent-press: #2f6fd6;
      --store: #2563eb; --cyan: #22d3ee; --error: #b3261e;
      --field: #f1f4f9;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: min(420px, calc(100vw - 48px)); text-align: center; padding: 32px 0; }
  .tile { width: 76px; height: 76px; display: block; margin: 0 auto 22px; }
  .wordmark { font-size: 38px; letter-spacing: -0.02em; line-height: 1; margin: 0 0 14px; }
  .wordmark .engram { font-weight: 700; }
  .wordmark .store { font-weight: 300; color: var(--store); }
  .wordmark .dot { display: inline-block; width: 9px; height: 9px; margin-left: 8px;
    border-radius: 50%; background: var(--cyan); vertical-align: 14px; }
  .tagline { font-size: 12px; font-weight: 600; letter-spacing: 0.38em; color: var(--muted);
    text-transform: uppercase; margin: 0 0 34px; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 18px;
    padding: 26px 24px; text-align: left; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  p.hint { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input {
    width: 100%; height: 44px; padding: 0 14px; font-size: 15px; color: var(--fg);
    background: var(--field); border: 1px solid var(--edge); border-radius: 12px; outline: none;
  }
  input::placeholder { color: var(--muted); }
  input:focus-visible { border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  button {
    margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { background: var(--accent-press); }
  button[disabled] { opacity: 0.6; cursor: default; }
  .error { color: var(--error); font-size: 14px; margin: 12px 0 0; min-height: 1em; }
  .connecting { display: none; padding: 10px 0; }
  .connecting .spin {
    width: 26px; height: 26px; margin: 6px auto 14px; border-radius: 50%;
    border: 3px solid var(--edge); border-top-color: var(--accent); animation: r 0.9s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  .connecting p { color: var(--muted); margin: 0; overflow-wrap: anywhere; text-align: center; }
  .fineprint { margin-top: 22px; font-size: 12.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <main>
    <img class="tile" src="icon.svg" alt="" />
    <p class="wordmark"><span class="engram">engram</span> <span class="store">store</span><span class="dot"></span></p>
    <p class="tagline">Private &middot; Encrypted &middot; Yours</p>

    <div class="card">
      <section id="form">
        <h1>Connect to your server</h1>
        <p class="hint">This app is a shell around a vault you host. Enter your deployment's address to begin.</p>
        <label for="server">Server address</label>
        <input id="server" type="text" inputmode="url" autocapitalize="off" autocorrect="off"
               spellcheck="false" placeholder="https://vault.example.com" autofocus />
        <button id="connect">Connect</button>
        <p class="error" id="error"></p>
      </section>

      <section class="connecting" id="connecting">
        <div class="spin"></div>
        <p id="connecting-to">Connecting&hellip;</p>
      </section>
    </div>

    <p class="fineprint">Servers must use https; plain http is supported for localhost only.</p>
  </main>

<script>
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  const form = document.getElementById("form");
  const connecting = document.getElementById("connecting");
  const connectingTo = document.getElementById("connecting-to");
  const input = document.getElementById("server");
  const button = document.getElementById("connect");
  const errorEl = document.getElementById("error");

  function showForm(prefill, error) {
    connecting.style.display = "none";
    form.style.display = "block";
    if (prefill) input.value = prefill;
    errorEl.textContent = error || "";
    button.disabled = false;
    input.focus();
  }
  function showConnecting(origin) {
    form.style.display = "none";
    connecting.style.display = "block";
    connectingTo.textContent = "Connecting to " + origin + "…";
  }

  async function connect() {
    const value = input.value.trim();
    if (!value) { errorEl.textContent = "Enter your server address."; return; }
    button.disabled = true;
    errorEl.textContent = "";
    showConnecting(value);
    try {
      // On success the shell navigates this window away; only a failure returns.
      await invoke("server_url_set", { url: value });
    } catch (e) {
      showForm(value, String(e));
    }
  }

  button.addEventListener("click", connect);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  (async () => {
    const params = new URLSearchParams(location.search);
    if (params.get("error")) {
      showForm(params.get("origin") || "", params.get("error"));
      return;
    }
    try {
      const stored = invoke ? await invoke("server_url_get") : null;
      if (stored) {
        // The shell is probing this address at startup and will either
        // navigate there or reload this page with the error.
        showConnecting(stored);
        return;
      }
    } catch (_) { /* fall through to the form */ }
    showForm("", "");
  })();
</script>
</body>
</html>
