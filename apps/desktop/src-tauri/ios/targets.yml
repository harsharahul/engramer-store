# Extension targets merged into the generated project.yml by
# ios-project-fix.mjs before xcodegen runs. Source paths are relative to
# gen/apple, where the merged file lives; ../../ios is this directory.
#
# Info.plist and entitlements are declared as properties here rather than
# as committed files: xcodegen treats the `path` as an OUTPUT it
# generates, so a committed file at that path would be overwritten. The
# paths below point inside gen/apple, the generated tree.
targets:
  EngramShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../../ios/ShareExtension
      - path: ../../ios/Shared
      - path: ../../ios/Generated
    info:
      path: EngramShare/Info.plist
      properties:
        CFBundleDisplayName: Engram Store
        CFBundleShortVersionString: "0.0.0"
        CFBundleVersion: "0.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 20
    entitlements:
      path: EngramShare/EngramShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.harsharahul.engramstore
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.harsharahul.engramstore
    dependencies:
      - framework: ../../ios/EngramCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harsharahul.engramstore.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: iPhone Developer
        # The plist is generated by xcodegen from `info:`; without this,
        # Xcode also synthesizes one and the two collide in the bundle.
        GENERATE_INFOPLIST_FILE: "NO"
