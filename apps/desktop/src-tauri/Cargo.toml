[package]
name = "engram-store-desktop"
version = "0.40.0"
description = "Engram Store desktop app"
authors = ["Harsha Rahul Boggaram"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
crypto_secretbox = "0.1"
blake2 = "0.10"
engram-core = { path = "../../../crates/engram-core" }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["sync"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-autostart = "2"
notify = "8"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

# The photo picker is iOS-only: it is the one route that hands over a photo's
# original bytes instead of a JPEG iOS transcoded on the way out.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-photos-ui = { version = "0.3", features = ["PHPicker", "block2"] }
objc2-photos = { version = "0.3", features = [
    "PHAsset",
    "PHFetchResult",
    "PHFetchOptions",
    "PHAssetResource",
    "PHAssetResourceManager",
    "PHPhotoLibrary",
    "PhotosTypes",
    "block2",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication",
    "UIGeometry",
    "UIResponder",
    "UIScrollView",
    "UIView",
    "UIViewController",
    "UIWindow",
] }

[lib]
name = "engram_store_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
