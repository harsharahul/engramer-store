version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The base image tracks a Node LTS line, matching the versions CI tests.
      # Major bumps are taken deliberately once the new line reaches Active LTS,
      # not on release day.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
