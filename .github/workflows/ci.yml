name: CI

# Runs when a release is published, or on demand. Day-to-day verification
# runs locally and in the project's own pipeline; hosted minutes are saved
# for the moments a published release needs an independent check.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: citest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENGRAMER_TEST_PG: postgres://postgres:citest@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm build
      - name: Run test suites
        run: pnpm test
      - name: Audit production dependencies for known vulnerabilities
        run: pnpm audit --prod --audit-level high

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate the TypeScript vectors
        run: pnpm --filter @engramer/crypto gen:vectors
      - name: Fail if the committed TypeScript vectors moved
        run: git diff --exit-code packages/crypto/test/vectors/ts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Scoped to the core crate: the shell predates rustfmt discipline.
      - run: cargo fmt -p engram-core -- --check
      - run: cargo clippy -p engram-core --all-targets -- -D warnings
      - name: Cross-language vectors, TypeScript to Rust
        run: cargo test -p engram-core
      - name: Regenerate the Rust vectors
        run: cargo run -p engram-core --bin gen-vectors
      - name: Fail if the committed Rust vectors moved
        run: git diff --exit-code packages/crypto/test/vectors/rs
      - name: Cross-language vectors, Rust to TypeScript
        run: pnpm --filter @engramer/crypto test

  ios-core:
    name: iOS core cross-build
    runs-on: macos-15
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p engram-core --target aarch64-apple-ios --release
      - run: cargo build -p engram-core --target aarch64-apple-ios-sim --release

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk for the image build
        # The image stages the on-device models and office assets, and the
        # two-architecture build doubles every layer; the hosted runner's
        # ~14GB headroom is not enough with its preinstalled toolchains
        # still aboard. None of these are used by this build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/powershell
          sudo docker image prune -af
          df -h /
      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'push' # arm64 emulation only needed for the multi-arch push
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push multi-arch (main and tags only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        if: github.event_name == 'pull_request'
        run: |
          docker build -t engramer-smoke .
          docker run -d --name smoke -p 3080:3080 engramer-smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3080/api/health && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1
