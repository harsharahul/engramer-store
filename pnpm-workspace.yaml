packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # transformers.js optional Node-side deps; the browser uses onnxruntime-web
  # (no build script), so none of these need their native builds.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  "tesseract.js": false
  vue-demi: true
overrides:
  # Force patched versions of Fastify's transitive deps into the tree until
  # Fastify ships them directly.
  fast-uri@3: "^3.1.5" # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7 (host confusion)
  fast-uri@4: "^4.1.2" # GHSA-7p8r-x3mc-p8w7 (backslash authority introducer)
  # transformers.js Node-side deps, unused by the browser bundle but audited:
  adm-zip@0.5: "^0.6.0" # GHSA-xcpc-8h2w-3j85 (zip bomb allocation)
  sharp@0.34: "^0.35.3" # GHSA-f88m-g3jw-g9cj (libvips CVEs)
  find-my-way@9: "^9.6.1" # GHSA-c96f-x56v-gq3h (HTTP/2 DoS)
  brace-expansion@5: "^5.0.9" # GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895 (expansion DoS)
  # SuperDoc lists the rollup-plugin-copy build tool in its runtime deps by
  # mistake; the browser bundle never imports it, and its glob@7 subtree drags
  # in an unpatched brace-expansion. Stub the subtree out entirely.
  rollup-plugin-copy: "npm:empty-npm-package@1.0.0"
