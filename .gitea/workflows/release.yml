name: Release image

# Runs on the Gitea mirror only. A version tag builds the production
# image natively on an amd64 and an arm64 runner in parallel, pushes
# both halves to the Gitea container registry, and stitches them into
# one multi-arch tag for the deployment pipeline to consume. GitHub CI
# independently publishes the same image to ghcr.io for self-hosters.

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: gitea.harsharahul.com
  IMAGE: neocortex/engram-store

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Reach the registry directly
        # The registry sits behind a proxy that caps upload sizes; image
        # layers go straight to the host instead.
        run: echo "${{ vars.GITEA_LAN_IP }} ${REGISTRY}" | sudo tee -a /etc/hosts

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.VERSION }}-amd64
          outputs: type=docker,dest=/tmp/image-amd64.tar

      - name: Push with Skopeo
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          which skopeo || (sudo apt-get update -qq && sudo apt-get install -y -qq skopeo)
          sudo mkdir -p /etc/containers
          echo -e '[engine]\nimage_parallel_copies = 1' | sudo tee /etc/containers/containers.conf
          CREDS="gitea-actions:${REGISTRY_TOKEN}"
          for attempt in 1 2 3; do
            skopeo copy --dest-tls-verify=false --dest-creds="$CREDS" \
              "docker-archive:/tmp/image-amd64.tar" \
              "docker://${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}-amd64" && exit 0
            echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1

  build-arm64:
    runs-on: mac-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reach the registry directly
        run: echo "${{ vars.GITEA_LAN_IP }} ${REGISTRY}" | sudo tee -a /etc/hosts

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build arm64
        run: |
          docker build --platform linux/arm64 \
            -t ${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}-arm64 \
            -f ./Dockerfile .
          docker save ${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}-arm64 -o /tmp/image-arm64.tar

      - name: Push with Skopeo
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          which skopeo || (sudo apt-get update -qq && sudo apt-get install -y -qq skopeo)
          CREDS="gitea-actions:${REGISTRY_TOKEN}"
          for attempt in 1 2 3; do
            skopeo copy --dest-tls-verify=false --dest-creds="$CREDS" \
              "docker-archive:/tmp/image-arm64.tar" \
              "docker://${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}-arm64" && exit 0
            echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          exit 1

  merge-manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Reach the registry directly
        run: echo "${{ vars.GITEA_LAN_IP }} ${REGISTRY}" | sudo tee -a /etc/hosts

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install manifest-tool
        run: |
          curl -fsSL https://github.com/estesp/manifest-tool/releases/download/v2.1.9/binaries-manifest-tool-2.1.9.tar.gz \
            | tar -xz manifest-tool-linux-amd64
          chmod +x manifest-tool-linux-amd64
          sudo mv manifest-tool-linux-amd64 /usr/local/bin/manifest-tool

      - name: Create versioned manifest
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          manifest-tool --insecure \
            --username gitea-actions --password "${REGISTRY_TOKEN}" \
            push from-args \
            --platforms linux/amd64,linux/arm64 \
            --template "${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}-ARCH" \
            --target "${REGISTRY}/${IMAGE}:${{ steps.version.outputs.VERSION }}"

  cleanup:
    runs-on: ubuntu-latest
    needs: merge-manifest
    steps:
      - name: Reach the registry directly
        run: echo "${{ vars.GITEA_LAN_IP }} ${REGISTRY}" | sudo tee -a /etc/hosts

      - name: Remove superseded image versions
        # Keeps the two newest releases (with their arch halves) so one
        # rollback target always exists; everything older goes.
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          VERSIONS=$(curl -sk "https://${REGISTRY}/api/v1/packages/neocortex/container/engram-store" \
            -H "Authorization: token ${REGISTRY_TOKEN}" | jq -r '.[].version' 2>/dev/null || true)
          KEEP=$(echo "$VERSIONS" | grep -Ev -- '-(amd64|arm64)$' | sort -rV | head -2)
          for VERSION in $VERSIONS; do
            BASE="${VERSION%-amd64}"
            BASE="${BASE%-arm64}"
            if echo "$KEEP" | grep -qx "$BASE"; then continue; fi
            echo "Deleting old version: $VERSION"
            curl -sk -X DELETE \
              "https://${REGISTRY}/api/v1/packages/neocortex/container/engram-store/$VERSION" \
              -H "Authorization: token ${REGISTRY_TOKEN}" || true
          done
