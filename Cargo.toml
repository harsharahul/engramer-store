[workspace]
resolver = "2"
members = ["crates/engram-core", "crates/engram-ffi", "apps/desktop/src-tauri"]

[profile.release]
lto = true

# swift-rs 1.0.8 with one fix for Xcode 27 release builds: the exported
# C symbols of every archive member are made global again, not only the
# member named after the package. See apps/desktop/vendor/swift-rs/VENDORED.md.
[patch.crates-io]
swift-rs = { path = "apps/desktop/vendor/swift-rs" }
