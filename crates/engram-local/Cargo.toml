[package]
name = "engram-local"
version = "0.1.0"
description = "On-device Engram Store backend: the server API over the server's own SQLite schema"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
futures-util = "0.3"
engram-core = { path = "../engram-core" }
flate2 = "1"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
