[package]
name = "engram-ffi"
version = "0.40.4"
edition = "2021"
description = "Swift bindings over engram-core for the iOS app extensions"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "lib"]
name = "engram_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
engram-core = { path = "../engram-core" }
serde_json = "1"
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
uniffi = { version = "0.29", features = ["bindgen-tests"] }
